<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Head Drawing">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4efe6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Heads, in 50 Lessons</title>
<style>
:root{--bg:#f4efe6;--ink:#23201c;--mute:#7a7266;--line:#d9d0c0;--card:#fffdf8;--acc:#b5482a;--ok:#3f7d4e}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a17;--ink:#ece6da;--mute:#9a9283;--line:#3a352e;--card:#26231f;--acc:#e0724f;--ok:#6fb383}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:18px/1.55 Georgia,"Iowan Old Style",serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.screen{display:none;min-height:100%;padding:max(16px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
.screen.on{display:block}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:34px;line-height:1.15;margin:.3em 0 .2em}
h2{font-size:28px;line-height:1.2;margin:.2em 0}
.sub{color:var(--mute);margin:0 0 1em}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 24px;cursor:pointer;font-size:17px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.acc{background:var(--acc);color:#fff}
.btn[disabled]{opacity:.35}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.stats{display:flex;gap:18px;color:var(--mute);font-size:15px}
.sect{margin:26px 0 8px;font:600 13px/1 -apple-system,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.les{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;min-height:58px}
.les .n{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:600 13px -apple-system,system-ui,sans-serif;flex:none}
.les.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.les.todo{opacity:.45;cursor:default}
.les small{display:block;color:var(--mute);font-size:13px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
.goal{font-style:italic;color:var(--mute);margin:0 0 14px}
.diagram{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
.diagram svg{width:100%;height:auto;max-height:44vh;display:block}
.cap{min-height:3.2em;margin:10px 4px;color:var(--ink)}
.beat{margin:0 0 1.1em}
.beat b{display:block;font:600 12px/1 -apple-system,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.challenge{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:14px 18px}
.guidebox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:14px}
.guidebox svg{width:100%;height:auto;max-height:34vh;display:block;opacity:.55}
.foot{margin-top:22px}
/* canvas */
#draw{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}
#draw.on{display:flex}
.tools{display:flex;gap:8px;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tools .btn{padding:9px 16px;font-size:15px}
.tools .btn.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.stage{position:relative;flex:1;background:#fff;touch-action:none;margin:10px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.stage canvas,.stage svg{position:absolute;inset:0;width:100%;height:100%}
#guide{pointer-events:none;opacity:.22;display:none}
#guide.on{display:block}
.timer{font:600 15px -apple-system,system-ui,sans-serif;color:var(--mute);min-width:48px;text-align:right}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gal figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.gal img{width:100%;background:#fff;border-radius:6px;display:block}
.gal figcaption{font-size:14px;color:var(--mute);margin-top:6px}
.lbar{width:96px;margin:0}
#s2 .row{flex-wrap:nowrap;gap:8px}
#s2 .btn{padding:12px 16px;font-size:16px;white-space:nowrap}
.ctext{font-size:22px;line-height:1.5;margin:14px 2px 20px;min-height:5.5em}
.draw-path{stroke-dasharray:1;stroke-dashoffset:1}
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen on"><div class="wrap">
  <h1>Heads, in 50 lessons</h1>
  <p class="sub">Men's and women's heads, after Andrew Loomis. One lesson per sitting. Twenty minutes, give or take.</p>
  <div class="bar"><i id="pbar"></i></div>
  <div class="stats"><span id="pcount">0 of 50 done</span><span id="streak">Streak: 0 days</span></div>
  <div class="row" style="margin-top:14px">
    <button class="btn alt" id="gbtn">Gallery</button>
    <button class="btn alt" id="exp">Export backup</button>
    <button class="btn alt" id="impb">Import backup</button>
    <input type="file" id="imp" accept="application/json" hidden>
  </div>
  <div id="list"></div>
</div></div>

<!-- GALLERY -->
<div id="gallery" class="screen"><div class="wrap">
  <div class="topbar"><button class="btn alt" data-home>&larr; Home</button></div>
  <h2>Gallery</h2>
  <p class="sub">Every lesson you completed, oldest first. Pick two to compare.</p>
  <div id="gal" class="gal"></div>
  <div id="cmp" style="display:none;margin-top:24px">
    <h2>Before and after</h2>
    <div style="position:relative;max-width:560px;background:#fff;border-radius:10px;overflow:hidden;touch-action:none" id="cmpbox">
      <img id="cA" style="width:100%;display:block">
      <div id="cBw" style="position:absolute;inset:0;overflow:hidden;width:50%"><img id="cB" style="width:100%;display:block;max-width:none"></div>
    </div>
    <input type="range" id="slide" min="0" max="100" value="50" style="width:100%;max-width:560px;margin-top:8px">
  </div>
</div></div>

<!-- LESSON -->
<div id="lesson" class="screen"><div class="wrap">
  <div class="topbar">
    <button class="btn alt" data-home>&larr; Home</button>
    <span class="sp"></span>
    <div class="bar lbar"><i id="lfill"></i></div>
  </div>
  <div id="s1" class="step">
    <div class="sect" id="lnum">Lesson 1</div>
    <h1 id="ltitle">The Ball</h1>
    <p class="goal" id="lgoal"></p>
    <div class="diagram"><svg id="dia" viewBox="0 0 400 300" role="img" aria-label="Animated construction of the ball"></svg></div>
    <div class="cap" id="dcap"></div>
    <div class="row"><button class="btn alt" id="replay">Replay</button><span class="sp"></span><button class="btn" data-next>Next</button></div>
  </div>
  <div id="s2" class="step" style="display:none">
    <div class="sect" id="ctag"></div>
    <div class="diagram"><svg id="cvis" viewBox="0 0 400 300" role="img" aria-label="Diagram for this step"></svg></div>
    <p class="ctext" id="ctext"></p>
    <div class="row">
      <button class="btn alt" id="speak">&#9654; Listen</button><span class="sp"></span>
      <button class="btn alt" data-prev>Back</button><button class="btn" data-next>Next</button>
    </div>
  </div>
  <div id="s3" class="step" style="display:none">
    <div class="sect">Challenge</div>
    <div class="challenge" id="chal"></div>
    <div class="guidebox"><svg id="gsvg" viewBox="0 0 400 300"></svg></div>
    <div class="row foot"><button class="btn alt" data-prev>Back</button><span class="sp"></span><button class="btn acc" id="start">Start drawing</button></div>
  </div>
</div></div>

<!-- CANVAS -->
<div id="draw">
  <div class="tools">
    <button class="btn alt" id="close">&larr; Back</button>
    <button class="btn alt" id="undo">Undo</button>
    <button class="btn alt" id="eraser">Eraser</button>
    <button class="btn alt" id="clear">Clear</button>
    <button class="btn alt" id="gtog">Guide</button>
    <span class="sp"></span>
    <span class="timer" id="timer">10:00</span>
    <button class="btn acc" id="done">Complete lesson</button>
  </div>
  <div class="stage" id="stage">
    <svg id="guide" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"></svg>
    <canvas id="cv"></canvas>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const TITLES=["The basic shape is a flattened ball","The all-important cross on the ball","The cross and the middle line determine the pose","Establishing the middle line","Simplified bone structure","The bony parts within the construction","Action of the head on the neck","Building the head out of pieces","Basic and secondary planes of the head","Tilting the head","Perspective in drawing the head","Variety in spacing creates types","Always build on the middle line","Creating any desired type","Types are built by varying the ball and the plane","Indicating character","Rhythmic lines in the head","Proportions of the male head","Drawing the head in units","Anatomy of the head","How the muscles function","The muscles from various angles","Mechanics of the mouth","Mechanics of the eyes","Movement of the lips","Construction of the nose and the ears","Expression: the laugh","Various expressions","Characterization through expression","Analysis of facial markings","Drawing faces of different ages","Modeling the planes","Combining anatomy, construction, and planes","Building tone with planes","Every head is a separate problem","Types of character","Smiling men","Older men","Characterization","Constructing the female head","Establish the construction of each head","Bone and muscle are less apparent in women's heads","Charm lies in the basic drawing","\"Blockiness\" also applies to women's heads","Some girls' heads","More girls' heads","Sketches (I)","Sketches (II)","Grandmothers","The aging process"];
const SECTIONS=[[1,8,"Construction"],[9,16,"Planes and types"],[17,19,"Rhythm and proportion"],[20,22,"Muscles"],[23,31,"Features and expression"],[32,39,"Tone and character studies"],[40,50,"Women's heads"]];
const LESSONS={
1:{name:"The Ball",goal:"Stop drawing ovals. Start drawing solid things.",minutes:10,
 beats:[["The problem","Every head starts as an oval with eyes and a nose jammed inside, and it comes out looking like a surprised potato."],
 ["The why","The oval is flat. A head isn't. The features have nowhere solid to sit."],
 ["The fix","Draw a ball. If you can't draw one freehand, use a coin or a compass. Loomis says so, and he'd know. Now push an imaginary nail through it, top to bottom. That is the axis. Wrap a line around the middle. That is the equator, and it becomes the brow line, where the eyebrows will live. Last, slice a thin piece off each side, because the skull is flatter there than a ball. What's left is the cranium, near enough. Draw every line all the way round, as if the ball were glass. A head isn't drawn until you can feel the unseen side."]],
 challenge:"Draw three balls. Give each one an axis, an equator, and shaved sides, with the lines going all the way round. Tilt each ball a little differently so the lines curve around it. Don't erase anything. Ten minutes, no more.",
 outro:"Tap Start drawing."},
2:{name:"The Cross on the Ball",goal:"Find the one point everything else is measured from.",minutes:10,
 beats:[["The problem","Where does the face actually go? Put an eye slightly too high and the head looks startled. Slide the nose over and it belongs to someone else. Without a guide, features get placed by guesswork, and guesses are mostly wrong."],
 ["The why","A ball has no landmarks. There is nothing to measure from."],
 ["The fix","The middle line runs down the center of the face, straight through the bridge of the nose. The brow line wraps around the ball at the equator. Where they cross, between the brows, is the key point of the whole construction. It never moves. It sets where the face sits on the ball, which means which way the head is turned. Continue the middle line up and down, and you have the middle line of the whole head. Draw both sides of the face from it. Continue the brow line around the side, and that is where the ears start. The eyes and cheekbones sit below the brow line, one on each side of the middle line."]],
 challenge:"Draw three balls and mark the cross on each: one facing you, one turned, one tilted. Using only the lines, make small marks where the eyes, nose, and mouth would land, and where the ears start. Placement only, no details. The two sides should match around the middle line. Ten minutes.",
 outro:"Tap Start drawing."}
};
const NARR=l=>l.beats.map(b=>b[1]).join(" ")+" So here's today's challenge. "+l.challenge+" "+l.outro;

/* ---------- storage ---------- */
const KEY="loomis.v1";
let S={done:{},days:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast("Can't save on this device right now. Export a backup.");return true}}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2400)}
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
function streak(){let d=new Date(),n=0;const set=new Set(S.days);if(!set.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);while(set.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}

/* ---------- screens ---------- */
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo(0,0)}
document.querySelectorAll("[data-home]").forEach(b=>b.onclick=()=>{stopSpeak();renderHome();show("home")});

function renderHome(){
  const n=Object.keys(S.done).length;
  $("pbar").style.width=(n/50*100)+"%";
  $("pcount").textContent=n+" of 50 done";
  $("streak").textContent="Streak: "+streak()+" day"+(streak()==1?"":"s");
  let h="";
  SECTIONS.forEach(([a,b,name])=>{
    h+=`<div class="sect">${name}</div><div class="lessons">`;
    for(let i=a;i<=b;i++){
      const ready=!!LESSONS[i],done=S.done[i];
      h+=`<button class="les ${done?"done":""} ${ready?"":"todo"}" ${ready?`data-l="${i}"`:"disabled"}><span class="n">${done?"&#10003;":i}</span><span>${TITLES[i-1]}<small>${ready?(done?"Done":"Ready"):"Not written yet"}</small></span></button>`;
    }
    h+="</div>";
  });
  $("list").innerHTML=h;
  $("list").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>openLesson(+b.dataset.l));
}

/* ---------- diagrams: each lesson draws itself ---------- */
const CX=200,CY=150,R=95,ACC="#b5482a";
const bz=(a,b,c,d,t)=>{const u=1-t;return u*u*u*a+3*u*u*t*b+3*u*t*t*c+t*t*t*d};
const EQ=[CX-R,CX-55,CX+55,CX+R,CY,CY+34,CY+34,CY];
const MD=[CX,CX+38,CX+38,CX,CY-R,CY-50,CY+50,CY+R];
const eqPt=t=>[bz(EQ[0],EQ[1],EQ[2],EQ[3],t),bz(EQ[4],EQ[5],EQ[6],EQ[7],t)];
const mdPt=t=>[bz(MD[0],MD[1],MD[2],MD[3],t),bz(MD[4],MD[5],MD[6],MD[7],t)];
function crossPt(){let b=[1e12,0,0];for(let i=0;i<=120;i++){const e=eqPt(i/120);for(let j=0;j<=120;j++){const m=mdPt(j/120);const d=(e[0]-m[0])**2+(e[1]-m[1])**2;if(d<b[0])b=[d,(e[0]+m[0])/2,(e[1]+m[1])/2]}}return [b[1],b[2]]}
function midX(y){let b=[1e9,0];for(let j=0;j<=200;j++){const m=mdPt(j/200);const d=Math.abs(m[1]-y);if(d<b[0])b=[d,m[0]]}return b[1]}
const XP=crossPt();
const P=(d,c,o)=>Object.assign({k:"p",d,c},o||{});
const CIRCLE=P(`M ${CX-R} ${CY} a ${R} ${R} 0 1 0 ${2*R} 0 a ${R} ${R} 0 1 0 ${-2*R} 0`,"A ball. If you can't draw one, trace a coin.",{w:3});
const AXIS=P(`M ${CX} ${CY-R-24} L ${CX} ${CY+R+24} M ${CX-10} ${CY-R-24} L ${CX+10} ${CY-R-24}`,"The axis: an imaginary nail through the top and out the bottom.");
const BROW=P(`M ${EQ[0]} ${EQ[4]} C ${EQ[1]} ${EQ[5]} ${EQ[2]} ${EQ[6]} ${EQ[3]} ${EQ[7]}`,"The equator. It becomes the brow line.",{col:ACC});
const SIDEL=P(`M ${CX-58} ${CY-75} C ${CX-72} ${CY-25} ${CX-72} ${CY+25} ${CX-58} ${CY+75}`,"Shave a thin slice off the side. Skulls are flatter there.");
const SIDER=P(`M ${CX+58} ${CY-75} C ${CX+72} ${CY-25} ${CX+72} ${CY+25} ${CX+58} ${CY+75}`,"And the other side. That is the cranium.");
const MIDL=P(`M ${MD[0]} ${MD[4]} C ${MD[1]} ${MD[5]} ${MD[2]} ${MD[6]} ${MD[3]} ${MD[7]}`,"The middle line runs down the center of the face.");
const BROW2=Object.assign({},BROW,{c:"The brow line wraps around the ball."});
const CROSS={k:"d",cx:XP[0],cy:XP[1],c:"Where they cross is the anchor. Everything is measured from this point."};
const eyeY=XP[1]+14,noseY=XP[1]+32,mouthY=XP[1]+48;
const eye=(x,y)=>`M ${x-12} ${y} q 12 -8 24 0 q -12 8 -24 0`;
const EYES=P(eye(midX(eyeY)-36,eyeY)+" "+eye(midX(eyeY)+36,eyeY),"Eyes sit below the brow line, one on each side of the middle line.");
const NOSE=P(`M ${midX(noseY)-10} ${noseY} L ${midX(noseY)+10} ${noseY}`,"The nose sits on the middle line.");
const MOUTH=P(`M ${midX(mouthY)-17} ${mouthY} q 17 7 34 0`,"So does the mouth.");
const EARS=P(`M ${CX-R-2} ${CY-10} q -13 13 0 28 M ${CX+R+2} ${CY-10} q 13 13 0 28`,"Carry the brow line around to the side. That is where the ears start.");
LESSONS[1].parts=[CIRCLE,AXIS,BROW,SIDEL,SIDER];
LESSONS[1].guide=[CIRCLE,AXIS,BROW,SIDEL,SIDER];
LESSONS[2].parts=[Object.assign({},CIRCLE,{c:"Start with the ball. No features. Nothing to measure from."}),BROW2,MIDL,CROSS,EYES,NOSE,MOUTH,EARS];
LESSONS[2].guide=[CIRCLE,BROW2,MIDL,CROSS];


const MIDEXT=P(`M ${CX} ${CY-R-16} L ${CX} ${CY-R} M ${CX} ${CY+R} L ${CX} ${CY+R+16}`,"");
const BACKEQ=P(`M ${EQ[0]} ${EQ[4]} C ${EQ[1]} ${CY-34} ${EQ[2]} ${CY-34} ${EQ[3]} ${EQ[7]}`,"",{col:ACC,dash:"5 7"});
const SK='fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"';
const T='font-family="Georgia,serif" font-size="17" fill="currentColor" text-anchor="middle"';
const RAW_POTATO=`<ellipse cx="200" cy="150" rx="72" ry="104" ${SK}/><path d="M170 134 q10 -7 20 0 q-10 7 -20 0 M210 134 q10 -7 20 0 q-10 7 -20 0 M200 142 l-5 22 l10 0 M188 186 q12 6 24 0" ${SK}/>`;
const RAW_FLAT=`<ellipse cx="105" cy="140" rx="58" ry="88" ${SK}/><text x="105" y="258" ${T}>flat</text>
<circle cx="293" cy="140" r="80" ${SK}/><path d="M250 190 q42 30 90 -8 M262 206 q38 22 70 -2 M330 100 q12 22 4 52 M318 92 q12 18 8 40" ${SK} opacity=".5"/><ellipse cx="300" cy="238" rx="62" ry="9" fill="currentColor" opacity=".12"/><text x="293" y="270" ${T}>solid</text>`;
const RAW_GUESS=`<circle cx="${CX}" cy="${CY}" r="${R}" ${SK}/><path d="M142 98 q12 -8 24 0 q-12 8 -24 0 M226 98 q12 -8 24 0 q-12 8 -24 0 M236 176 l-4 16 l10 0 M150 208 q16 7 32 0" ${SK}/><text x="318" y="70" ${T} opacity=".6" font-size="36">?</text>`;
const RAW_BARE=`<circle cx="${CX}" cy="${CY}" r="${R}" ${SK}/><text x="${CX}" y="${CY+22}" ${T} opacity=".35" font-size="64">?</text>`;

function visCard(parts,hi){
  const H=[].concat(hi===undefined?[]:hi);
  return parts.map((p,i)=>{
    const on=H.includes(i);
    if(p.k==="d")return `<circle data-i="${i}" cx="${p.cx}" cy="${p.cy}" r="6" fill="${ACC}" ${on?'style="opacity:0"':""}/>`;
    const col=on?ACC:(p.col||"currentColor");
    const dash=p.dash&&!on?` stroke-dasharray="${p.dash}"`:"";
    return `<path ${on&&!p.dash?'class="draw-path" pathLength="1"':""} data-i="${i}" data-hi="${on?1:0}" d="${p.d}" fill="none" stroke="${col}" stroke-width="${p.w||2.5}" stroke-linecap="round" stroke-linejoin="round"${dash}/>`;
  }).join("");
}
LESSONS[1].cards=[
 {tag:"The problem",text:"Every head starts as an oval with eyes and a nose jammed inside, and it comes out looking like a surprised potato.",raw:RAW_POTATO},
 {tag:"The why",text:"The oval is flat. A head isn't. The features have nowhere solid to sit.",raw:RAW_FLAT},
 {tag:"The fix, 1 of 5",text:"Draw a ball. If you can't draw one freehand, use a coin or a compass. Loomis says so, and he'd know.",parts:[CIRCLE],hi:0},
 {tag:"The fix, 2 of 5",text:"Push an imaginary nail through it, top to bottom. That is the axis.",parts:[CIRCLE,AXIS],hi:1},
 {tag:"The fix, 3 of 5",text:"Wrap a line around the middle. That is the equator, and it becomes the brow line, where the eyebrows will live.",parts:[CIRCLE,AXIS,BROW],hi:2},
 {tag:"The fix, 4 of 5",text:"Slice a thin piece off each side, because the skull is flatter there than a ball. What's left is the cranium, near enough.",parts:[CIRCLE,AXIS,BROW,SIDEL,SIDER],hi:[3,4]},
 {tag:"The fix, 5 of 5",text:"Draw every line all the way round, as if the ball were glass. A head isn't drawn until you can feel the unseen side.",parts:[CIRCLE,AXIS,BROW,SIDEL,SIDER,BACKEQ],hi:5}
];
LESSONS[2].cards=[
 {tag:"The problem",text:"Where does the face actually go? Put an eye slightly too high and the head looks startled. Slide the nose over and it belongs to someone else. Without a guide, features get placed by guesswork, and guesses are mostly wrong.",raw:RAW_GUESS},
 {tag:"The why",text:"A ball has no landmarks. There is nothing to measure from.",raw:RAW_BARE},
 {tag:"The fix, 1 of 6",text:"The middle line runs down the center of the face, straight through the bridge of the nose.",parts:[CIRCLE,MIDL],hi:1},
 {tag:"The fix, 2 of 6",text:"The brow line wraps around the ball at the equator.",parts:[CIRCLE,MIDL,BROW2],hi:2},
 {tag:"The fix, 3 of 6",text:"Where they cross, between the brows, is the key point of the whole construction. It never moves. It sets where the face sits on the ball, which means which way the head is turned.",parts:[CIRCLE,MIDL,BROW2,CROSS],hi:3},
 {tag:"The fix, 4 of 6",text:"Continue the middle line up and down, and you have the middle line of the whole head. Draw both sides of the face from it.",parts:[CIRCLE,MIDL,BROW2,CROSS,MIDEXT],hi:4},
 {tag:"The fix, 5 of 6",text:"Continue the brow line around the side, and that is where the ears start. The eyes and cheekbones sit below the brow line, one on each side of the middle line.",parts:[CIRCLE,MIDL,BROW2,CROSS,EYES,EARS],hi:[4,5]},
 {tag:"The fix, 6 of 6",text:"The nose and mouth sit on the middle line.",parts:[CIRCLE,MIDL,BROW2,CROSS,EYES,EARS,NOSE,MOUTH],hi:[6,7]}
];

function svgFor(parts,animated){
  const ns=animated?"":' vector-effect="non-scaling-stroke"';
  return parts.map((p,i)=>{
    if(p.k==="d")return `<circle data-i="${i}" cx="${p.cx}" cy="${p.cy}" r="6" fill="${ACC}" ${animated?'style="opacity:0"':""}/>`;
    return `<path ${animated?'class="draw-path"':""} data-i="${i}" d="${p.d}" ${animated?'pathLength="1"':""} fill="none" stroke="${p.col||"currentColor"}" stroke-width="${p.w||2.5}" stroke-linecap="round" stroke-linejoin="round"${ns}/>`;
  }).join("");
}
let animT=[];
function playDiagram(){
  animT.forEach(clearTimeout);animT=[];
  const L=LESSONS[cur],svg=$("dia");
  svg.setAttribute("style","color:var(--ink)");
  svg.innerHTML=svgFor(L.parts,true);
  $("dcap").textContent="";
  L.parts.forEach((p,i)=>{
    animT.push(setTimeout(()=>{
      const el=svg.querySelector(`[data-i="${i}"]`);
      if(p.k==="d"){el.style.transition="opacity .6s";el.style.opacity=1}
      else{el.style.transition="stroke-dashoffset 1.1s ease";el.style.strokeDashoffset="0"}
      $("dcap").textContent=p.c;
    },i*1700));
  });
}
function guideMarkup(n){
  const g=LESSONS[n].guide;
  const one=(x,y,r,tilt)=>`<g transform="translate(${x} ${y}) rotate(${tilt}) scale(${r/95}) translate(${-CX} ${-CY})" style="color:#000">${svgFor(g,false)}</g>`;
  return one(75,150,60,-12)+one(200,150,60,0)+one(325,150,60,14);
}

/* ---------- lesson flow ---------- */
let cur=0,step=0;
function openLesson(n){
  cur=n;const L=LESSONS[n];
  $("lnum").textContent="Lesson "+n;
  $("ltitle").textContent=L.name;
  $("lgoal").textContent=L.goal;
  $("chal").innerHTML=`<div class="beat" style="margin:0"><b>So here's today's challenge</b>${L.challenge} ${L.outro}</div>`;
  $("gsvg").innerHTML=guideMarkup(n);$("gsvg").setAttribute("style","opacity:.55");
  show("lesson");go(0);
}
function renderCard(c){
  $("ctag").textContent=c.tag;
  $("ctext").textContent=c.text;
  const svg=$("cvis");svg.setAttribute("style","color:var(--ink)");
  svg.innerHTML=c.raw?c.raw:visCard(c.parts,c.hi);
  svg.querySelectorAll('[data-hi="1"]').forEach(el=>{requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transition="stroke-dashoffset 1s ease";el.style.strokeDashoffset="0"}))});
  svg.querySelectorAll('circle[style*="opacity:0"]').forEach(el=>{setTimeout(()=>{el.style.transition="opacity .6s";el.style.opacity=1},300)});
}
function go(k){
  const L=LESSONS[cur],C=L.cards.length,last=C+1;
  k=Math.max(0,Math.min(last,k));step=k;
  $("s1").style.display=k===0?"block":"none";
  $("s2").style.display=(k>=1&&k<=C)?"block":"none";
  $("s3").style.display=k===last?"block":"none";
  $("lfill").style.width=(k/last*100)+"%";
  animT.forEach(clearTimeout);
  if(k===0)playDiagram();
  if(k>=1&&k<=C)renderCard(L.cards[k-1]);
  stopSpeak();
  window.scrollTo(0,0);
}
document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>go(step+1));
document.querySelectorAll("[data-prev]").forEach(b=>b.onclick=()=>go(step-1));
$("replay").onclick=playDiagram;

/* ---------- read aloud ---------- */
let speaking=false;
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}speaking=false;$("speak").innerHTML="&#9654; Listen"}
$("speak").onclick=()=>{
  if(!("speechSynthesis" in window)){toast("This browser can't read aloud.");return}
  if(speaking){stopSpeak();return}
  const u=new SpeechSynthesisUtterance($("ctext").textContent);
  u.rate=.95;u.onend=()=>stopSpeak();
  speechSynthesis.cancel();speechSynthesis.speak(u);speaking=true;$("speak").innerHTML="&#9632; Stop";
};

/* ---------- canvas ---------- */
const cv=$("cv"),ctx=cv.getContext("2d"),stage=$("stage");
let strokes=[],active=null,erasing=false,W=0,H=0,dpr=1,timerH=null,secs=0;
function size(){
  const r=stage.getBoundingClientRect();if(!r.width)return;
  dpr=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);redraw();
}
function drawStroke(c,s,w,h){
  const p=s.p;if(!p.length)return;
  c.save();c.lineCap="round";c.lineJoin="round";
  c.globalCompositeOperation=s.e?"destination-out":"source-over";
  c.strokeStyle="#1a1a1a";
  if(p.length===1){c.beginPath();c.arc(p[0][0]*w,p[0][1]*h,(s.e?10:1.4+p[0][2]*2.2)/2,0,7);c.fillStyle=s.e?"#000":"#1a1a1a";c.fill();c.restore();return}
  for(let i=1;i<p.length;i++){
    c.lineWidth=s.e?22:1.2+((p[i][2]+p[i-1][2])/2)*3.6;
    c.beginPath();c.moveTo(p[i-1][0]*w,p[i-1][1]*h);
    c.lineTo(p[i][0]*w,p[i][1]*h);c.stroke();
  }
  c.restore();
}
function redraw(){ctx.clearRect(0,0,W,H);strokes.forEach(s=>drawStroke(ctx,s,W,H))}
function pt(e){
  const r=cv.getBoundingClientRect();
  let pr=e.pressure;if(!pr||e.pointerType==="mouse"||e.pointerType==="touch")pr=.5;
  return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,pr];
}
cv.addEventListener("pointerdown",e=>{
  e.preventDefault();cv.setPointerCapture(e.pointerId);
  active={e:erasing,p:[pt(e)]};strokes.push(active);redraw();
});
cv.addEventListener("pointermove",e=>{
  if(!active)return;e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  (evs.length?evs:[e]).forEach(ev=>active.p.push(pt(ev)));
  redraw();
});
const end=e=>{if(active){active=null;persistDraft()}};
cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
cv.addEventListener("contextmenu",e=>e.preventDefault());
$("undo").onclick=()=>{strokes.pop();redraw();persistDraft()};
$("clear").onclick=()=>{if(strokes.length&&confirm("Clear the whole canvas?")){strokes=[];redraw();persistDraft()}};
$("eraser").onclick=()=>{erasing=!erasing;$("eraser").classList.toggle("sel",erasing)};
$("gtog").onclick=()=>{const on=$("guide").classList.toggle("on");$("gtog").classList.toggle("sel",on)};
function persistDraft(){try{localStorage.setItem(KEY+".draft."+cur,JSON.stringify(strokes))}catch(e){}}
function startTimer(){
  clearInterval(timerH);secs=LESSONS[cur].minutes*60;tick();
  timerH=setInterval(()=>{if(secs>0){secs--;tick()}},1000);
}
function tick(){$("timer").textContent=Math.floor(secs/60)+":"+String(secs%60).padStart(2,"0")}
$("start").onclick=()=>{
  strokes=[];try{strokes=JSON.parse(localStorage.getItem(KEY+".draft."+cur)||"[]")}catch(e){}
  $("guide").innerHTML=guideMarkup(cur);
  $("guide").classList.remove("on");$("gtog").classList.remove("sel");
  erasing=false;$("eraser").classList.remove("sel");
  $("draw").classList.add("on");startTimer();
  requestAnimationFrame(size);
};
$("close").onclick=()=>{clearInterval(timerH);$("draw").classList.remove("on")};
window.addEventListener("resize",()=>{if($("draw").classList.contains("on"))size()});
$("done").onclick=()=>{
  if(!strokes.length){toast("Draw something first.");return}
  const w=1000,h=Math.round(1000*H/W),c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);
  const layer=document.createElement("canvas");layer.width=w;layer.height=h;
  const lx=layer.getContext("2d");strokes.forEach(s=>drawStroke(lx,s,w,h));
  x.drawImage(layer,0,0);
  S.done[cur]={date:today(),img:c.toDataURL("image/jpeg",.85)};
  if(!S.days.includes(today()))S.days.push(today());
  if(!save())return;
  try{localStorage.removeItem(KEY+".draft."+cur)}catch(e){}
  clearInterval(timerH);$("draw").classList.remove("on");
  toast("Lesson "+cur+" complete.");renderHome();show("home");
};

/* ---------- gallery ---------- */
let picks=[];
$("gbtn").onclick=()=>{
  const items=Object.entries(S.done).sort((a,b)=>a[1].date.localeCompare(b[1].date)||a[0]-b[0]);
  $("gal").innerHTML=items.length?items.map(([n,d])=>`<figure data-n="${n}"><img src="${d.img}" alt=""><figcaption>Lesson ${n} &middot; ${d.date}</figcaption></figure>`).join(""):"<p class='sub'>Nothing yet. Finish a lesson.</p>";
  picks=[];$("cmp").style.display="none";
  $("gal").querySelectorAll("figure").forEach(f=>f.onclick=()=>{
    picks.push(f.dataset.n);if(picks.length>2)picks.shift();
    $("gal").querySelectorAll("figure").forEach(g=>g.style.outline=picks.includes(g.dataset.n)?"2px solid var(--acc)":"none");
    if(picks.length===2){$("cA").src=S.done[picks[0]].img;$("cB").src=S.done[picks[1]].img;$("cmp").style.display="block";setCmp()}
  });
  show("gallery");
};
function setCmp(){const v=$("slide").value;$("cBw").style.width=v+"%";const w=$("cmpbox").getBoundingClientRect().width;$("cB").style.width=w+"px"}
$("slide").oninput=setCmp;

/* ---------- backup ---------- */
$("exp").onclick=()=>{
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="head-drawing-backup-"+today()+".json";
  document.body.appendChild(a);a.click();a.remove();
};
$("impb").onclick=()=>$("imp").click();
$("imp").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{try{const o=JSON.parse(t);if(!o.done)throw 0;S=Object.assign({done:{},days:[]},o);save();renderHome();toast("Backup restored.")}catch(x){toast("That file isn't a backup.")}});
};

renderHome();
</script>
</body>
